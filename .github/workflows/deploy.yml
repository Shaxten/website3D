name: Déploiement GitHub Pages

# Compile le site (Vite) et publie le résultat dans la branche gh-pages.
# Dans Settings → Pages : Source « Deploy from a branch », branche gh-pages, dossier / (root).
on:
  push:
    branches: [main, deploy-gh-pages]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Empêche Jekyll de traiter les fichiers du build.
      - run: touch dist/.nojekyll

      - name: Publier dist/ dans la branche gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
